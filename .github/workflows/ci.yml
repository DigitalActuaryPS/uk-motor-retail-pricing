name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run pipeline on simulated data
        run: make data competitor conversion renewal-fit elasticity optimisation retention governance sql
      - name: Tests
        run: make test
      - name: Reflection checks
        run: make reports verify
